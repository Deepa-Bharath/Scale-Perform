services:
  dev:
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./node_modules:/app/node_modules
    command: npm run dev
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongodb
  mongodb:
    image: mongo:latest
    container_name: scale_perform_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: scale_perform
  prod:
    build:
      context: .
      target: production
    ports:
      - "5000:5000"

volumes:
  mongo-data:
    driver: local
