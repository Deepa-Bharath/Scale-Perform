services:
  dev:
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./node_modules:/app/node_modules
    command: npm run dev
    ports:
      - "5000:5000"
    env_file:
      - .env
  prod:
    build:
      context: .
      target: production
    ports:
      - "5000:5000"
